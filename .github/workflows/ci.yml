name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run gen:docs
      - name: Verify generated documentation is current
        run: git diff --exit-code -- docs/llms.md docs/llms llms.txt
      - run: npm run build:lib
      - run: npm run verify:public-api
      - run: npm run build
