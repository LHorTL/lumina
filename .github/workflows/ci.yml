name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: '验证范围；select 仅用于明确要求定向验证的 Select 发布'
        type: choice
        default: full
        options: [full, select]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Resolve validation scope
        id: validation
        run: node scripts/resolve-validation-scope.mjs
        env:
          REQUESTED_VALIDATION_SCOPE: ${{ inputs.validation_scope }}

      - run: npm ci
      - if: steps.validation.outputs.scope != 'select'
        run: npm run typecheck
      - if: steps.validation.outputs.scope != 'select'
        run: npm run test:unit
      - if: steps.validation.outputs.scope == 'select'
        run: npx tsc --noEmit -p tsconfig.select.json
      - if: steps.validation.outputs.scope == 'select'
        run: npx vitest run --root . --environment jsdom tests/select-responsive.test.tsx tests/select-remote-search.test.tsx
      - if: steps.validation.outputs.scope == 'select'
        run: npx vitest run --root . --environment jsdom tests/form-controls-regressions.test.tsx tests/picker-regressions.test.tsx -t Select
      - run: npm run gen:docs
      - name: Verify generated documentation is current
        run: git diff --exit-code -- docs/llms.md docs/llms llms.txt
      - run: npm run build:lib
      - if: steps.validation.outputs.scope != 'select'
        run: npm run verify:public-api
      - if: steps.validation.outputs.scope == 'select'
        run: node scripts/check-select-package.mjs
      - run: npm run build
